tools:
- name: search_news
  description: Search news articles with the full News API filter set — keywords, language, country, source
    domain and rank, sentiment, entities, media, dates, sorting, faceting, highlighting.
- name: suggest
  description: Resolve a name or prefix (e.g. "Tesla") to APITube taxonomy IDs — entity.id, category.id
    (IPTC medtop slugs), topic.id, industry.id — for precise search_news filters.
