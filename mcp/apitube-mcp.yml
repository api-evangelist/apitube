name: APITube News MCP-Server
status: official
description: 'First-party hosted MCP server for the APITube News API. Streamable HTTP JSON-RPC at https://mcp.apitube.io/
  — no package to install. Two tools (search_news, suggest) and four ready-made prompts (monitor_company,
  topic_sentiment, breaking_news, compare_coverage). tools/list answers anonymously with full inputSchemas
  (saved verbatim to mcp/apitube-tools-list.json); tool calls require an API key as Authorization: Bearer.
  Not available on the Free plan (403 ER0706). Per-key endpoint scopes, expiry and IP allowlists are enforced
  at the MCP layer too.'
