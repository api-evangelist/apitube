openapi: 3.2.0
info:
  title: APITube News System API
  version: 1.0.0
  summary: Search and filter news articles from thousands of sources worldwide.
  description: APITube News API provides programmatic access to a comprehensive, real-time news database aggregated from thousands of sources worldwide.
  contact:
    name: APITube Support
    url: https://apitube.io
    email: support@apitube.io
  termsOfService: https://apitube.io/terms/terms-of-service
servers:
- url: https://api.apitube.io
security:
- ApiKeyHeader: []
- ApiKeyQuery: []
tags:
- name: System
  description: Health checks and service status.
paths:
  /ping:
    get:
      summary: Ping (Health Check)
      tags:
      - System
      description: Returns "pong" if the server is running.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                description: Server is healthy
                type: string
              example: pong
      operationId: getPing
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key passed via X-API-Key header
    ApiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: API key passed as query parameter
externalDocs:
  description: APITube News API Documentation
  url: https://docs.apitube.io
