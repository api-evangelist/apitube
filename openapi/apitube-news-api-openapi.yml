  /v1/news/raw:
    post:
      summary: Get raw articles (before parsing & enrichment)
      tags:
      - News
      description: Returns raw articles straight from the discovery stage, before HTML parsing and NLP enrichment. This is a fast-churning staging feed (rows are continuously consumed by the pipeline and expire within ~1 day). Enrichment fields (language, categories, topics, entities, sentiment, etc.) are not available at this stage. Supports pagination, source filtering, a published date range, and basic sorting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  description: Page number (default 1).
                  example: 1
                per_page:
                  type: integer
                  description: Results per page (default 100, max 250; the Free plan is capped at 10 and Starter at 50).
                  example: 100
                source.id:
                  type: string
                  description: Comma-separated source (sitemap) IDs (max 3).
                  example: '123'
                ignore.source.id:
                  type: string
                  description: Comma-separated source IDs to exclude (max 3).
                  example: '789'
                published_at:
                  type: string
                  description: Single day filter (creates a 24h range). ISO 8601 / YYYY-MM-DD / relative.
                  example: '2026-05-27'
                published_at.start:
                  type: string
                  description: Start of the publication date range.
                  example: '2026-05-26'
                published_at.end:
                  type: string
                  description: End of the publication date range.
                  example: '2026-05-27'
                sort.by:
                  type: string
                  enum:
                  - id
                  - published_at
                  - created_at
                  description: Sort field (default id).
                  example: id
                sort.order:
                  type: string
                  enum:
                  - asc
                  - desc
                  description: Sort direction (default desc).
                  example: desc
                prompt:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: 'Plain-language description of the news you want. Only PARTIALLY applied here: this endpoint understands published_at.start, published_at.end, sort.order and per_page, so anything else the prompt produced is reported in meta.prompt.ignored with reason "unsupported_on_endpoint". The 2-point translation fee still applies on a cache miss. Available on Basic and above — on Free and Starter the request fails with 403 ER0706.'
      responses:
        '200':
          description: Successful response with raw articles
          content:
            application/json:
              schema:
                description: Successful response with raw articles
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    description: Response status
                  limit:
                    type: integer
                    description: Results per page
                  path:
                    type: string
                    description: Current request URL
                  page:
                    type: integer
                    description: Current page number
                  has_next_pages:
                    type: boolean
                    description: Whether more pages are available
                  next_page:
                    type: string
                    description: URL for the next page (empty if none)
                  has_previous_page:
                    type: boolean
                    description: Whether a previous page exists
                  previous_page:
                    type: string
                    description: URL for the previous page (empty if none)
                  request_id:
                    type: string
                    description: Unique request identifier
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Raw article ID
                        title:
                          type:
                          - string
                          - 'null'
                          description: Article title from RSS
                        href:
                          type:
                          - string
                          - 'null'
                          description: Article URL
                        created_at:
                          type:
                          - string
                          - 'null'
                          description: Publication date from RSS (may be null)
                        description:
                          type:
                          - string
                          - 'null'
                          description: Short description from RSS
                        body:
                          type: string
                          description: Article body with HTML stripped (plain text)
                        body_html:
                          type: string
                          description: Article body as received from RSS (HTML)
                        author:
                          type:
                          - string
                          - 'null'
                          description: Author from RSS
                        keywords:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                          description: Raw RSS keywords/categories
                        source:
                          type: object
                          description: Source (publisher) details, resolved from the sitemap repository
                          properties:
                            id:
                              type:
                              - integer
                              - 'null'
                              description: Source (sitemap) ID
                            domain:
                              type: string
                              description: Source domain
                            home_page_url:
                              type: string
                              description: Source home page URL
                            type:
                              type: string
                              description: Source resource type
                            bias:
                              type: string
                              description: Political bias (left/center/right)
                            rankings:
                              type: object
                              properties:
                                opr:
                                  type:
                                  - number
                                  - 'null'
                                  description: Open PageRank
                            location:
                              type: object
                              properties:
                                country_name:
                                  type: string
                                country_code:
                                  type: string
                            favicon:
                              type: string
                              description: Favicon URL
                    description: Array of raw (unenriched) articles
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                description: Authentication error
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - not_ok
                    description: Response status
                  request_id:
                    type:
                    - 'null'
