                  description: API key (alternative to X-API-Key header)
      responses:
        '200':
          description: Successful response with trend data
          content:
            application/json:
              schema:
                description: Successful response with trend data
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  field:
                    type: string
                    description: Aggregated field (single-field request)
                  fields:
                    type: array
                    items:
                      type: string
                    description: Aggregated fields (multi-field request)
                  per_page:
                    type: integer
                    description: Results per field
                  offset:
                    type: integer
                    description: Pagination offset
                  total_count:
                    type: integer
                    description: Distinct values count (single-field request)
                  total_articles:
                    type: integer
                    description: Total matching articles (single-field request)
                  sort:
                    type: string
                    description: Sort field used
                  order:
                    type: string
                    enum:
                    - asc
                    - desc
                    description: Sort order used
                  mincount:
                    type: integer
                    description: Minimum article count threshold used
                  percentile:
                    type: integer
                    description: Percentile filter (present when percentile is set)
                  time_bucket:
                    type: string
                    description: Time bucket (present when time_bucket is set)
                  compare_window:
                    type: string
                    description: Comparison window (present when compare=1)
                  trending_days:
                    type: integer
                    description: Trending window in days (present when trending=1)
                  cached:
                    type: boolean
                    description: Whether the result was served from cache
                  trends:
                    description: For a single field — an array of trend items. For multiple fields — an object keyed by field name, each holding { trends, total_count, total_articles }.
                    oneOf:
                    - type: array
                      items:
                        type: object
                        properties:
                          value:
                            description: Aggregated value. A plain string when no enrichment is available, or an enriched object (id, name, type, ...) for entities/categories/topics/sources.
                            oneOf:
                            - type: string
                            - type: object
                              additionalProperties: true
                          count:
                            type: integer
                            description: Article count for this value
                          percentage:
                            type: number
                            description: Share of total matching articles (%)
                          growth_rate:
                            type:
                            - number
                            - 'null'
                            description: Articles per hour over the value lifetime
                          trending_score:
                            type: number
                            description: Trending score (present when trending=1)
                          trending_history:
                            type: object
                            description: Per-bucket history (present when trending=1)
                            additionalProperties: true
                          previous_count:
                            type: integer
                            description: Count in the comparison window (present when compare=1)
                          change_absolute:
                            type: integer
                            description: Absolute change vs comparison window (present when compare=1)
                          change_percent:
                            type: number
                            description: Percentage change vs comparison window (present when compare=1)
                          buckets:
                            type: object
                            description: Counts per time bucket (present when time_bucket is set)
                            additionalProperties: true
                          total:
                            type: integer
                            description: Total across buckets (present when time_bucket is set)
                    - type: object
                      additionalProperties:
                        type: object
                        properties:
                          trends:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
                          total_count:
                            type: integer
                          total_articles:
                            type: integer
                  request_id:
                    type: string
              example:
                status: ok
                field: entity.id
                per_page: 10
                offset: 0
                total_count: 1240
                total_articles: 58213
                sort: count
                order: desc
                mincount: 1
                trends:
                - value:
                    id: 5012
                    name: SpaceX
                    type: organization
                  count: 342
                  percentage: 0.59
                  growth_rate: 2.15
                - value:
                    id: 3401
                    name: Elon Musk
                    type: person
                  count: 218
                  percentage: 0.37
                  growth_rate: 1.45
                request_id: req_abc123def456
