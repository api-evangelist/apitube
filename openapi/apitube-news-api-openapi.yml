                  description: Latitude for radius search
                location.lng:
                  type: number
                  minimum: -180
                  maximum: 180
                  description: Longitude for radius search
                location.radius:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 20000
                  description: Search radius in kilometers (requires location.lat and location.lng)
                location.radius.min:
                  type: number
                  minimum: 0
                  maximum: 20000
                  description: Minimum distance from point in km
                is_duplicate:
                  type: integer
                  enum:
                  - 0
                  - 1
                  description: Filter duplicate/unique articles
                is_paywall:
                  type: integer
                  enum:
                  - 0
                  - 1
                  description: Filter paywalled articles
                is_breaking:
                  type: integer
                  enum:
                  - 0
                  - 1
                  description: Filter breaking news articles
                is_high_quality:
                  type: integer
                  enum:
                  - 0
                  - 1
                  description: Filter high-quality articles (not duplicate, rank >= 5, has images, has author)
                author.id:
                  type: string
                  description: Comma-separated author IDs (max 3)
                ignore.author.id:
                  type: string
                  description: Exclude these author IDs (comma-separated, max 3)
                author.name:
                  type: string
                  maxLength: 100
                  description: Filter by author name (comma-separated, max 3)
                ignore.author.name:
                  type: string
                  maxLength: 100
                  description: Exclude articles by these authors (comma-separated, max 3)
                has_author:
                  type: integer
                  enum:
                  - 0
                  - 1
                  description: Filter articles with/without author
                facet:
                  type: string
                  enum:
                  - '0'
                  - '1'
                  description: Enable faceting
                facet.field:
                  type: string
                  description: 'Comma-separated facet fields (max 5). Values: source.id, source.country.id, source.bias, language.id, author.id, category.id, topic.id, industry.id, entity.id, sentiment.overall.polarity, sentiment.title.polarity, sentiment.body.polarity, sentiment.strength, is_duplicate, is_free, is_important, media.images.count, media.videos.count, read_time, content.length, published.year, published.month, published.day_of_week, published.hour, published.weekday, published.time_of_day'
                  example: source.id,category.id
                facet.limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 10
                  description: Maximum number of facet values per field (max 100)
                facet.mincount:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Minimum count for a facet value to be included
                facet.range:
                  type: string
                  enum:
                  - '0'
                  - '1'
                  description: Enable range faceting
                facet.range.field:
                  type: string
                  description: 'Field for range faceting. Values: published_at, sentiment.overall.score, sentiment.title.score, sentiment.body.score, read_time, source.rank.opr, media.images.count, media.videos.count'
                facet.range.start:
                  type: string
                  description: Start value for range faceting (required with facet.range)
                facet.range.end:
                  type: string
                  description: End value for range faceting (required with facet.range)
                facet.range.gap:
                  type: string
                  default: +1DAY
                  description: Gap value for range faceting
                hl:
                  type: string
                  enum:
                  - '0'
                  - '1'
                  description: Enable highlighting
                hl.fl:
                  type: string
                  default: title,description
                  description: 'Comma-separated fields to highlight (max 5). Values: title, description, body'
                  example: title,description
                hl.fragsize:
                  type: integer
                  minimum: 50
                  maximum: 500
                  default: 150
                  description: Size of highlighted fragment in characters (50-500)
                hl.snippets:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 3
                  description: Number of highlighted snippets per field (max 10)
                hl.tag.pre:
                  type: string
                  description: Opening tag for highlighted text
                  default: <em>
                hl.tag.post:
                  type: string
                  description: Closing tag for highlighted text
                  default: </em>
                export:
                  type: string
                  enum:
                  - json
                  - csv
                  - tsv
                  - xml
                  - rss
                  - xlsx
                  - parquet
                  - jsonl
                  - ndjson
                  description: Export format
                fl:
                  type: string
                  description: Comma-separated list of fields to include in the response
                  example: id,title,published_at,source.domain
                debug:
                  type: string
                  enum:
                  - '0'
                  - '1'
                  description: Include user_input in response for debugging
                api_key:
                  type: string
                  description: API key (alternative to X-API-Key header)
