                    additionalProperties: true
                  headlines:
                    type: array
                    description: Headlines (present in some responses)
                    items:
                      type: object
                      additionalProperties: true
                  meta:
                    type: object
                    description: 'Additional metadata. Present only when there is something to report about how the request was handled: `prompt` (the request used the prompt parameter) and/or `warnings` (the query was silently narrowed, e.g. ER0366 clamping a title search to the last 31 days).'
                    properties:
                      prompt:
                        type: object
                        description: How the `prompt` parameter was translated into filters. Returned by every JSON response to a request that used it (the SSE stream has no JSON envelope, so it carries none).
                        properties:
                          text:
                            type: string
                            description: The prompt as it was parsed, trimmed
                          applied:
                            type: object
                            description: Parameters the prompt was translated into — the request that actually ran
                            additionalProperties:
                              type: string
                          ignored:
                            type: array
                            description: Values understood but not used
                            items:
                              type: object
                              properties:
                                field:
                                  type: string
                                  description: Parameter that was not applied
                                value:
                                  type: string
                                  description: Value the prompt produced for it
                                reason:
                                  type: string
                                  enum:
                                  - not_found
                                  - explicit_param
                                  - unsupported_on_endpoint
                                  - invalid_date
                                  - title_too_long
                                  - title_window_clamped
                                  description: Why the value was not applied
                          cached:
                            type: boolean
                            description: true when this wording had been parsed before, so no parse fee was charged
