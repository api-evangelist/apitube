        '200':
          description: Articles near the point with optional local insights
          content:
            application/json:
              schema:
                description: Articles near the point with optional local insights
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  query:
                    type: object
                    properties:
                      lat:
                        type: number
                      lng:
                        type: number
                      radius_km:
                        type: number
                      place:
                        type: string
                        description: Resolved place name (only when `place` was used)
                      resolved_entity_id:
                        type:
                        - integer
                        - 'null'
                        description: Entity id the place was geocoded to
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
