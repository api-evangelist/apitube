      parameters:
      - schema:
          type: string
        in: path
        name: entityId
        required: true
        description: Entity ID
      responses:
        '200':
          description: Successful response with articles
          content:
            application/json:
              schema:
                description: Successful response with articles
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    description: Response status
                  limit:
                    type: integer
                    description: Results per page
                  path:
                    type: string
                    description: Current request URL
                  page:
                    type: integer
                    description: Current page number
                  has_next_pages:
                    type: boolean
                    description: Whether more pages are available
                  next_page:
                    type: string
                    description: URL for the next page (empty if no next page)
                  has_previous_page:
                    type: boolean
                    description: Whether a previous page exists
                  previous_page:
                    type: string
                    description: URL for the previous page (empty if no previous page)
                  export:
                    type: object
                    description: Export format URLs
                    properties:
                      json:
                        type: string
                      xlsx:
                        type: string
                      csv:
                        type: string
                      tsv:
                        type: string
                      xml:
                        type: string
                      rss:
                        type: string
                      parquet:
                        type: string
                      jsonl:
                        type: string
                  request_id:
                    type: string
                    description: Unique request identifier
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique article ID
                        href:
                          type:
                          - string
                          - 'null'
                          description: Original article URL
                        published_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: Publication date in ISO 8601
                        title:
                          type:
                          - string
                          - 'null'
                          description: Article title
                        description:
                          type:
                          - string
                          - 'null'
                          description: Article description (plain text)
                        body:
                          type:
                          - string
                          - 'null'
                          description: Article body (plain text)
                        body_html:
                          type:
                          - string
                          - 'null'
                          description: Article body (HTML)
                        language:
                          type: string
                          description: ISO 639-1 language code
                        translations:
                          type: object
                          description: Machine translations of the article title and description. Always present; fields stay null for English articles and for languages without a translation model
                          properties:
                            en:
                              type: object
                              properties:
                                title:
                                  type:
                                  - string
                                  - 'null'
                                  description: Title translated to English
                                description:
                                  type:
                                  - string
                                  - 'null'
                                  description: Description translated to English (plain text)
                        author:
                          type: object
                          properties:
                            id:
                              type:
                              - integer
                              - 'null'
                              description: Author ID
                            name:
                              type: string
                              description: Author name
                        image:
                          type: string
                          description: Main article image URL
                        categories:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: Category ID
                              name:
                                type: string
                                description: Category name
                              score:
                                type: number
                                description: Relevance score
                              taxonomy:
                                type: string
                                description: Taxonomy identifier
                              links:
                                type: object
                                properties:
                                  self:
                                    type: string
                                    description: Link to category endpoint
                        topics:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Topic ID
                              name:
                                type: string
                                description: Topic name
                              score:
                                type: number
                                description: Relevance score
                              links:
                                type: object
                                properties:
                                  self:
                                    type: string
                                    description: Link to topic endpoint
                        industries:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: Industry ID
                              name:
                                type: string
                                description: Industry name
                              links:
                                type: object
                                properties:
                                  self:
                                    type: string
                                    description: Link to industry endpoint
                        entities:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: Entity ID
                              name:
                                type: string
                                description: Entity name
                              type:
                                type: string
                                enum:
                                - person
                                - location
                                - organization
                                - brand
                                - product
                                - natural-disaster
                                - disease
                                - event
                                - sport
                                - unknown
                                description: Entity type
                              frequency:
                                type: integer
                                description: Number of mentions in the article
                              sentiment:
                                type: object
                                description: Sentiment toward this entity (aggregated across its mentions)
                                properties:
                                  score:
                                    type: number
                                    description: Entity sentiment score from -1 (negative) to 1 (positive)
                                  polarity:
                                    type: string
                                    enum:
                                    - positive
                                    - negative
                                    - neutral
                                    - ''
                                    description: Entity sentiment polarity
                                  mentions:
                                    type: object
                                    description: Per-mention polarity breakdown
                                    properties:
                                      positive:
                                        type: integer
                                      neutral:
                                        type: integer
                                      negative:
                                        type: integer
                              title:
                                type: object
                                properties:
                                  pos:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        start:
                                          type: integer
                                          description: Start character offset
                                        end:
                                          type: integer
                                          description: End character offset
                                    description: Mention positions in title
                              body:
                                type: object
                                properties:
                                  pos:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        start:
                                          type: integer
                                          description: Start character offset
                                        end:
                                          type: integer
                                          description: End character offset
                                    description: Mention positions in body
                              links:
                                type: object
                                properties:
                                  self:
                                    type: string
                                    description: Link to entity endpoint
                                  wikipedia:
                                    type: string
                                    description: Wikipedia URL
                                  wikidata:
                                    type: string
                                    description: Wikidata URL
                              metadata:
                                type: object
                                description: Additional entity metadata (varies by entity type)
                                additionalProperties: true
                        locations_mentioned:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                description: Location name
                              country:
                                type: string
                                description: Country code
                              lat:
                                type:
                                - number
                                - 'null'
                                description: Latitude
                              lng:
                                type:
                                - number
                                - 'null'
                                description: Longitude
                              type:
                                type: string
                                description: Location type
                        source:
                          type: object
                          properties:
                            id:
                              type:
                              - integer
                              - 'null'
                              description: Source ID
                            domain:
                              type: string
                              description: Source domain
                            home_page_url:
                              type: string
                              description: Source home page URL
                            type:
                              type: string
                              description: Source type
                            bias:
                              type: string
                              description: Media bias (left, center, right)
                            rankings:
                              type: object
                              properties:
                                opr:
                                  type: integer
                                  description: Open PageRank score
                            location:
                              type: object
                              properties:
                                country_name:
                                  type: string
                                  description: Source country name
                                country_code:
                                  type: string
                                  description: Source country ISO code
                            favicon:
                              type: string
                              description: Source favicon URL
                        sentiment:
                          type: object
                          properties:
                            overall:
                              type: object
                              properties:
                                score:
                                  type: number
                                  description: Sentiment score from -1 (negative) to 1 (positive)
                                polarity:
                                  type: string
                                  enum:
                                  - positive
                                  - negative
                                  - neutral
                                  - ''
                                  description: Sentiment polarity
                            title:
                              type: object
                              properties:
                                score:
                                  type: number
                                  description: Sentiment score from -1 (negative) to 1 (positive)
                                polarity:
                                  type: string
                                  enum:
                                  - positive
                                  - negative
                                  - neutral
                                  - ''
                                  description: Sentiment polarity
                            body:
                              type: object
                              properties:
                                score:
                                  type: number
                                  description: Sentiment score from -1 (negative) to 1 (positive)
                                polarity:
                                  type: string
                                  enum:
                                  - positive
                                  - negative
                                  - neutral
                                  - ''
                                  description: Sentiment polarity
                        summary:
                          type: array
