                          - 'null'
                        distance_km:
                          type:
                          - number
                          - 'null'
                          description: Distance to the nearest location, km
                        relevance_score:
                          type:
                          - number
                          - 'null'
                          description: Composite relevance (only when sort=relevance)
                        nearest_location:
                          type:
                          - object
                          - 'null'
                          properties:
                            entity_id:
                              type:
                              - integer
                              - 'null'
                            name:
                              type: string
                            lat:
                              type:
                              - number
                              - 'null'
                            lng:
                              type:
                              - number
                              - 'null'
                            country:
                              type: string
                  local_insights:
                    type: object
                    description: Present only when `insights` is requested
                    properties:
                      mood:
                        type: object
                        properties:
                          avg_sentiment:
                            type:
                            - number
                            - 'null'
                          distribution:
                            type: object
                            properties:
                              positive:
                                type: integer
                              neutral:
                                type: integer
                              negative:
                                type: integer
                      hotspots:
                        type: array
                        items:
                          type: object
                          properties:
                            lat:
                              type: number
                            lng:
                              type: number
                            count:
                              type: integer
                      top_events:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                            category:
                              type:
                              - string
                              - 'null'
                            count:
                              type: integer
                            avg_sentiment:
                              type:
                              - number
                              - 'null'
                      top_entities:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type:
                              - integer
                              - 'null'
                            name:
                              type:
                              - string
                              - 'null'
                            type_id:
                              type:
                              - integer
                              - 'null'
                            count:
                              type: integer
                      bias_split:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            count:
                              type: integer
                            avg_sentiment:
                              type:
                              - number
                              - 'null'
                      top_sources:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            domain:
                              type:
                              - string
                              - 'null'
                            bias:
                              type:
                              - string
                              - 'null'
                            opr:
                              type:
                              - integer
                              - 'null'
                            count:
                              type: integer
                      timeline:
                        type: object
                        additionalProperties:
                          type: integer
                      top_categories:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {}
                            name:
                              type:
                              - string
                              - 'null'
                            count:
                              type: integer
                      top_topics:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {}
                            name:
                              type:
                              - string
                              - 'null'
                            count:
                              type: integer
                      breaking:
                        type: object
                        properties:
                          count:
                            type: integer
                          share:
                            type: number
                            description: Percentage of breaking articles
                      velocity:
                        type: object
                        properties:
                          articles_per_hour:
                            type:
                            - number
                            - 'null'
                          window_hours:
                            type: integer
                      movers:
                        type: array
                        description: Entities/topics accelerating vs their 14-day baseline
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - entity
                              - topic
                            id: {}
                            name:
                              type:
                              - string
                              - 'null'
                            count_now:
                              type: integer
                            count_baseline:
                              type: integer
                            growth_pct:
                              type:
                              - number
                              - 'null'
                  total:
                    type: integer
