                  ranking_weights:
                    type: object
                    description: Effective relevance weights (only when sort=relevance)
                    properties:
                      distance:
                        type: number
                      opr:
                        type: number
                      recency:
                        type: number
                      important:
                        type: number
                  request_id:
                    type:
                    - string
                    - 'null'
              example:
                status: ok
                query:
                  lat: 52.52
                  lng: 13.4
                  radius_km: 50
                results:
                - id: 88412091
                  title: Berlin transit strike enters second day
                  published_at: '2026-05-22T07:10:00.000Z'
                  distance_km: 1.83
                  nearest_location:
                    entity_id: 1234
                    name: Berlin Mitte
                    lat: 52.52
                    lng: 13.4
                    country: de
                local_insights:
                  mood:
                    avg_sentiment: -0.21
                    distribution:
                      positive: 41
                      neutral: 88
                      negative: 132
                  top_events:
                  - type: protest
                    category: society
                    count: 23
                    avg_sentiment: -0.38
                  top_entities:
                  - id: 567
                    name: Kai Wegner
                    type_id: 1
                    count: 19
                  bias_split:
                    left:
                      count: 88
                      avg_sentiment: -0.18
                    center:
                      count: 154
                      avg_sentiment: -0.2
                    right:
                      count: 19
                      avg_sentiment: -0.41
                request_id: req_abc123def456
