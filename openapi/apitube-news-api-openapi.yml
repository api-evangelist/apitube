  /v1/news/local:
    post:
      summary: Local news around a point
      tags:
      - News
      description: Returns news articles whose mentioned locations fall within `radius` km of `lat`/`lng`, sorted by proximity. Each article is enriched with `distance_km` and `nearest_location`. Supports the same filters as `/v1/news/everything`. Optionally returns a `local_insights` dashboard (mood, hotspots, extracted events, top entities, media-bias split, top sources, timeline) via the `insights` parameter. Costs 1 point + 1 per requested insight block.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lat:
                  type: number
                  minimum: -90
                  maximum: 90
                  description: Latitude of the search center (required unless `place` is given)
                lng:
                  type: number
                  minimum: -180
                  maximum: 180
                  description: Longitude of the search center (required unless `place` is given)
                place:
                  type: string
                  description: Place name to geocode into the search center instead of lat/lng (e.g. `Berlin`). Resolved heuristically against the entity graph; ambiguous names are matched to the best candidate — add `country` or pass `lat`/`lng` for precision. Explicit lat/lng take precedence over `place`.
                  example: Berlin
                country:
                  type: string
                  description: ISO 3166-1 alpha-2 code to disambiguate `place` (e.g. `de`)
                  example: de
                radius:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 20000
                  default: 50
                  description: Search radius in kilometers (default 50, max 20000)
                sort:
                  type: string
                  enum:
                  - distance
                  - published_at
                  - relevance
                  default: distance
                  description: 'Sort order: nearest first (`distance`), newest first (`published_at`), or `relevance` (blends proximity + source authority + recency + breaking; adds `relevance_score` to each article)'
                ranking:
                  type: string
                  enum:
                  - balanced
                  - proximity
                  - authority
                  - fresh
                  default: balanced
                  description: 'Relevance weighting preset (only when sort=relevance): balanced, proximity (closer wins), authority (bigger sources win), fresh (recency wins). Override individual weights with w.* params.'
                w.distance:
                  type: number
                  minimum: 0
                  description: Relevance weight for proximity (overrides preset)
                w.opr:
                  type: number
                  minimum: 0
                  description: Relevance weight for source authority (overrides preset)
                w.recency:
                  type: number
                  minimum: 0
                  description: Relevance weight for recency (overrides preset)
                w.important:
                  type: number
                  minimum: 0
                  description: Relevance weight for breaking/importance (overrides preset)
                insights:
                  type: string
                  description: 'Comma-separated local intelligence blocks to compute over the radius. Values: mood, hotspots, events, entities, bias, sources, timeline, top_categories, top_topics, breaking, velocity, movers. `velocity`/`movers` use rolling time windows and are most accurate without an explicit published_at filter. Each block costs 1 additional point.'
                  example: top_categories,breaking,movers
                prompt:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: 'Plain-language description of the news you want, e.g. "Elon Musk, Tesla, news for the last 10 days". It is translated into the regular filters below before the search runs, and the resulting parameters are returned in meta.prompt. Explicit parameters always win over the prompt. Costs 2 extra points when the wording has not been parsed before (repeats are served from cache). Available on Basic and above — on Free and Starter the request fails with 403 ER0706. Errors: ER0706 (plan), ER0800 (length), ER0801 (translation service unavailable), ER0802 (nothing usable in the prompt).'
                page:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Page number for pagination
                per_page:
                  type: integer
                  minimum: 1
                  maximum: 250
                  default: 100
                  description: Number of results per page (max 250; the Free plan is capped at 10 and Starter at 50)
                sort.by:
                  type: string
                  enum:
                  - published_at
                  - relevance
                  - engagement
                  - quality
                  - controversy
                  - trust
                  - id
                  - new
                  - created_at
                  - source.rank.opr
                  - sentiment.overall.score
                  - sentiment.title.score
                  - sentiment.body.score
                  - read_time
                  - sentences_count
                  - paragraphs_count
                  - characters_count
                  - media.images.count
                  - media.videos.count
                  - media.images.width.min
                  - media.images.width.max
                  - media.images.height.min
                  - media.images.height.max
                  - media_richness
                  - shares.facebook.min
                  - shares.facebook.max
                  - shares.twitter.min
                  - shares.twitter.max
                  - shares.reddit.min
                  - shares.reddit.max
                  default: published_at
                  description: Field to sort results by
                sort.order:
                  type: string
                  enum:
                  - asc
                  - desc
                  default: desc
                  description: Sort order
                article.id:
                  type: string
                  description: Comma-separated article IDs (max 5)
                  example: '12345'
                title:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: 'Search in article titles. Supports phrase search with proximity: "climate change"~2. Title search is limited to a 31-day published_at window: without published_at.start / published_at.end the last 31 days are searched, a wider explicit range returns ER0110.'
                ignore.title:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: Exclude articles containing this text in the title
                title_starts_with:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: Filter articles whose title starts with the given text. Same 31-day window limit as title
                title_ends_with:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: Filter articles whose title ends with the given text. Same 31-day window limit as title
                title_pattern:
                  type: string
                  minLength: 2
                  maxLength: 200
                  description: Filter articles whose title matches the given pattern. Same 31-day window limit as title
                published_at:
                  type: string
                  description: 'Exact date (creates 24-hour range). Format: YYYY-MM-DD or ISO 8601'
                  example: '2025-01-15'
                published_at.start:
                  type: string
                  description: 'Start of date range. Format: YYYY-MM-DD or ISO 8601. Combined with a title search the range may not exceed 31 days (ER0110)'
                  example: '2025-01-01'
                published_at.end:
                  type: string
                  description: 'End of date range. Format: YYYY-MM-DD or ISO 8601. Combined with a title search the range may not exceed 31 days (ER0110)'
                  example: '2025-01-31'
                language.code:
                  type: string
                  description: Comma-separated ISO 639-1 language codes (max 3)
                  example: en
                ignore.language.code:
                  type: string
                  description: Exclude articles in these languages (comma-separated, max 3)
                  example: zh,ar
                source.country.code:
                  type: string
                  description: Filter by source country ISO 3166-1 alpha-2 codes (comma-separated, max 3)
                  example: us
                ignore.source.country.code:
                  type: string
                  description: Exclude sources from these countries (comma-separated, max 3)
                  example: us
                source.rank.opr.min:
                  type: integer
                  minimum: 0
                  description: Minimum Open PageRank score
                source.rank.opr.max:
                  type: integer
                  minimum: 0
                  description: Maximum Open PageRank score
                source.id:
                  type: string
                  description: Comma-separated source IDs (max 3)
                  example: '100'
                ignore.source.id:
                  type: string
                  description: Exclude these source IDs (comma-separated, max 3)
                source.domain:
                  type: string
                  description: Comma-separated source domains (max 3)
                  example: nytimes.com
                ignore.source.domain:
                  type: string
                  description: Exclude these source domains (comma-separated, max 3)
                source.bias:
                  type: string
                  description: 'Filter by media bias (comma-separated). Values: left, center, right'
                  example: left
                ignore.source.bias:
                  type: string
                  description: 'Exclude sources with this media bias (comma-separated). Values: left, center, right'
                  example: right
                is_premium_source:
                  type: integer
                  enum:
                  - 0
                  - 1
                  description: Filter by premium source status
                is_verified_source:
                  type: integer
                  enum:
                  - 0
                  - 1
                  description: Filter by verified source status
                category.id:
                  type: string
                  description: Comma-separated category IDs (max 3)
                  example: iab-1
                ignore.category.id:
