    servers:
    - url: https://api.apitube.io
      description: Production API server
  /v1/news/trends:
    get:
      summary: Get trending topics and entities
      description: Aggregate and analyze trending values across specific fields such as entities, categories, topics, industries, and sources. Supports time-series analysis and comparison with previous periods.
      operationId: getTrends
      tags:
      - News
      parameters:
      - name: api_key
        in: query
        description: Your API key (alternative to X-API-Key header)
        required: false
        schema:
          type: string
      - name: field
        in: query
        description: Fields to aggregate on. Required.
        required: true
        schema:
          type: string
          enum:
          - entity.id
          - category.id
          - topic.id
          - industry.id
          - source.id
        example: entity.id
      - name: language.code
        in: query
        description: Filter by language.
        required: false
        schema:
          type: string
        example: en
      - name: published_at.start
        in: query
        description: Start of date range.
        required: false
        schema:
          type: string
        example: NOW-7DAYS
      - name: published_at.end
        in: query
        description: End of date range.
        required: false
        schema:
          type: string
        example: NOW
      - name: per_page
        in: query
        description: Top results to return per field (1–100).
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sort
        in: query
        description: Sort trending results by.
        required: false
        schema:
          type: string
          enum:
          - count
          - value
          - growth_rate
          - change
          - trending_score
          default: count
      - name: order
        in: query
        description: Sort order.
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: mincount
        in: query
        description: Minimum article count for a value to be included.
        required: false
        schema:
          type: integer
          minimum: 1
      - name: trending
        in: query
        description: Enable trending analysis with time-series history.
        required: false
        schema:
          type: boolean
      - name: trending_days
        in: query
        description: Number of days to analyze for trending (7–30).
        required: false
        schema:
          type: integer
          minimum: 7
          maximum: 30
          default: 14
      - name: compare
        in: query
        description: Enable comparison with a previous time period.
        required: false
        schema:
          type: boolean
      - name: compare_window
        in: query
        description: Comparison window size.
        required: false
        schema:
          type: string
          enum:
          - 24HOURS
          - 7DAYS
          - 1WEEK
          - 2w
          - 1m
      responses:
        '200':
          description: Trending aggregation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      summary: Get trending topics and entities
      tags:
      - News
      description: 'Returns trending aggregations across news articles. Analyze trends by source, category, topic, industry, or entity. Supports time bucketing, comparison windows, growth rate analysis, and percentile filtering. Maximum date range: 30 days.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                field:
                  type: string
                  description: Comma-separated fields to aggregate (max 5). Required.
                  enum:
                  - source.id
                  - category.id
                  - topic.id
                  - industry.id
                  - entity.id
                per_page:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 10
                  description: Number of results per field
                offset:
                  type: integer
                  minimum: 0
                  default: 0
                  description: Offset for pagination
                mincount:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  default: 1
                  description: Minimum article count for a value to be included
                sort:
                  type: string
                  enum:
                  - count
                  - value
                  - growth_rate
                  - change
                  - trending_score
                  default: count
                  description: Sort field (change and trending_score require compare=1)
                order:
                  type: string
                  enum:
                  - asc
                  - desc
                  default: desc
                  description: Sort order
                time_bucket:
                  type: string
                  enum:
                  - hour
                  - day
                  - week
                  - month
                  description: Time bucket for time-series breakdown
                trending:
                  type: string
                  enum:
                  - '0'
                  - '1'
                  description: Enable trending analysis with growth rate calculation
                trending_days:
                  type: integer
                  minimum: 7
                  maximum: 30
                  default: 14
                  description: Number of days for trending analysis window
                compare:
                  type: string
                  enum:
                  - '0'
                  - '1'
                  description: Enable period comparison
                compare_window:
                  type: string
                  description: 'Comparison window (required when compare=1). Examples: 24HOURS, 7DAYS, 1WEEK, 1w, 2m'
                percentile:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Filter results above this percentile
                prompt:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: 'Plain-language description of the news you want, e.g. "Elon Musk, Tesla, news for the last 10 days". It is translated into the regular filters below before the search runs, and the resulting parameters are returned in meta.prompt. Explicit parameters always win over the prompt. Costs 2 extra points when the wording has not been parsed before (repeats are served from cache). Available on Basic and above — on Free and Starter the request fails with 403 ER0706. Errors: ER0706 (plan), ER0800 (length), ER0801 (translation service unavailable), ER0802 (nothing usable in the prompt).'
                published_at:
                  type: string
                  description: 'Exact date (creates 24-hour range). Format: YYYY-MM-DD or ISO 8601'
                  example: '2025-01-15'
                published_at.start:
                  type: string
                  description: 'Start of date range. Format: YYYY-MM-DD or ISO 8601. Combined with a title search the range may not exceed 31 days (ER0110)'
                  example: '2025-01-01'
                published_at.end:
                  type: string
                  description: 'End of date range. Format: YYYY-MM-DD or ISO 8601. Combined with a title search the range may not exceed 31 days (ER0110)'
                  example: '2025-01-31'
                language.code:
                  type: string
                  description: Comma-separated ISO 639-1 language codes (max 3)
                  example: en
                ignore.language.code:
                  type: string
                  description: Exclude articles in these languages (comma-separated, max 3)
                  example: zh,ar
                source.country.code:
                  type: string
                  description: Filter by source country ISO 3166-1 alpha-2 codes (comma-separated, max 3)
                  example: us
                ignore.source.country.code:
                  type: string
                  description: Exclude sources from these countries (comma-separated, max 3)
                  example: us
                source.rank.opr.min:
                  type: integer
                  minimum: 0
                  description: Minimum Open PageRank score
                source.rank.opr.max:
                  type: integer
                  minimum: 0
                  description: Maximum Open PageRank score
                source.id:
                  type: string
                  description: Comma-separated source IDs (max 3)
                  example: '100'
                ignore.source.id:
                  type: string
                  description: Exclude these source IDs (comma-separated, max 3)
                source.domain:
                  type: string
                  description: Comma-separated source domains (max 3)
                  example: nytimes.com
                ignore.source.domain:
                  type: string
                  description: Exclude these source domains (comma-separated, max 3)
                source.bias:
                  type: string
                  description: 'Filter by media bias (comma-separated). Values: left, center, right'
                  example: left
                ignore.source.bias:
                  type: string
                  description: 'Exclude sources with this media bias (comma-separated). Values: left, center, right'
                  example: right
                category.id:
                  type: string
                  description: Comma-separated category IDs (max 3)
                  example: iab-1
                ignore.category.id:
                  type: string
                  description: Exclude these categories (comma-separated, max 3)
                topic.id:
                  type: string
                  description: Comma-separated topic IDs (max 3)
                  example: technology
                ignore.topic.id:
                  type: string
                  description: Exclude these topics (comma-separated, max 3)
                industry.id:
                  type: string
                  description: Comma-separated industry IDs (max 3)
                  example: '1'
                ignore.industry.id:
                  type: string
                  description: Exclude these industries (comma-separated, max 3)
                entity.id:
                  type: string
                  description: Comma-separated entity IDs (max 3)
                  example: '12345'
                ignore.entity.id:
                  type: string
                  description: Exclude these entity IDs (comma-separated, max 3)
                entity.sentiment.polarity:
                  type: string
                  enum:
                  - positive
                  - negative
                  - neutral
                  description: Filter by sentiment polarity toward the entity (combine with entity.id or *.name; standalone = any entity)
                entity.sentiment.score.min:
