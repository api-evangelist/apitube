  /v1/journalists/{id}:
    get:
      summary: Get a journalist profile
      tags:
      - Reference
      description: 'Returns a journalist profile: name, all `outlets` they publish under (merged by name), and a `coverage` block (article counts, timeline, sentiment, top topics, top covered entities).'
      parameters:
      - schema:
          type: string
        in: query
        name: coverage
        required: false
        description: Set to "false" to skip the coverage block (activity, timeline, top topics/entities).
      - schema:
          type: integer
        in: path
        name: id
        required: true
        description: Journalist (author) ID.
      responses:
        '200':
          description: A single journalist profile
          content:
            application/json:
              schema:
                description: A single journalist profile
                type: object
                properties:
                  id:
                    type: integer
                    description: Journalist (author) ID
                  name:
                    type: string
                    description: Journalist name
                  outlets:
                    type: array
                    description: Outlets the journalist writes for
                    items:
                      type: object
                      additionalProperties: true
                  outlet_count:
                    type: integer
                    description: Number of outlets (list endpoint only)
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        description: Link to this journalist profile
                      articles:
                        type: string
                        description: Link to articles by this journalist
                  coverage:
                    type:
                    - object
                    - 'null'
                    description: Aggregated coverage stats (omitted when coverage=false, null on error)
                    properties:
                      article_count:
                        type: integer
                        description: Total articles in coverage scope
                      first_seen:
                        type:
                        - string
                        - 'null'
                        description: Date of the earliest article (YYYY-MM-DD)
                      last_seen:
                        type:
                        - string
                        - 'null'
                        description: Date of the latest article (YYYY-MM-DD)
                      sentiment:
                        type: object
                        properties:
                          positive:
                            type: integer
                          neutral:
                            type: integer
                          negative:
                            type: integer
                      momentum:
                        type: object
                        properties:
                          last_30_days:
                            type: integer
                          previous_30_days:
                            type: integer
                          change_pct:
                            type:
                            - integer
                            - 'null'
                            description: Percent change vs previous 30 days
                      timeline:
                        type: array
                        items:
                          type: object
                          properties:
                            period:
                              type: string
                              description: Month bucket (YYYY-MM-DD)
                            count:
                              type: integer
                      top_topics:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type:
                              - integer
                              - string
                              description: Item ID
                            name:
                              type: string
                            count:
                              type: integer
                      top_entities:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type:
                              - integer
                              - string
                              description: Item ID
                            name:
                              type: string
                            count:
                              type: integer
                      top_countries:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            code:
                              type: string
                            count:
                              type: integer
                      top_languages:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            code:
                              type: string
                            count:
                              type: integer
                  recent_articles:
                    type: array
                    description: Up to 5 most recent articles (full article objects)
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique article ID
                        href:
                          type:
                          - string
                          - 'null'
                          description: Original article URL
                        published_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: Publication date in ISO 8601
                        title:
                          type:
                          - string
                          - 'null'
                          description: Article title
                        description:
                          type:
                          - string
                          - 'null'
                          description: Article description (plain text)
                        body:
                          type:
                          - string
                          - 'null'
                          description: Article body (plain text)
                        body_html:
                          type:
                          - string
                          - 'null'
                          description: Article body (HTML)
                        language:
                          type: string
                          description: ISO 639-1 language code
                        translations:
                          type: object
                          description: Machine translations of the article title and description. Always present; fields stay null for English articles and for languages without a translation model
                          properties:
                            en:
                              type: object
                              properties:
                                title:
                                  type:
                                  - string
                                  - 'null'
