note: >-
  APITube serves an RFC 9727 api-catalog linkset on the apex (and www), and a second, different
  api-catalog on the docs host whose service-desc names a third host, api-reference.apitube.io,
  carrying the same 26-operation OpenAPI 3.1 spec as api.apitube.io/openapi.json. llms.txt is
  served on the apex and on docs (different documents). No security.txt, no OpenID/OAuth
  metadata, no ai-plugin, no A2A agent card on any host. api.apitube.io answers every
  unauthenticated path 401 (key-gated edge), and mcp.apitube.io answers JSON-RPC route-not-found
  404s — neither is an SPA catch-all, so the negatives are real.
