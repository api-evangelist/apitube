x-provenance:
  added: '2026-08-21'
  method: searched
  source: https://apitube.io/.well-known/api-catalog
  note: >-
    Submitted via apis.io/add on 2026-08-20 from apitubehq@gmail.com. THE SUBMITTED APIs.json URL
    IS WRONG: https://apitube.io/apis.json returns 404, and so does a control path, so the 404 is
    real rather than a catch-all. That is a bad pointer in the submission, NOT an absent surface —
    APITube publishes plenty. Everything here was discovered from the RFC 9727 api-catalog at the
    apex instead, which is the authoritative discovery document.
    TWO OPENAPI DOCUMENTS EXIST AND THEY DISAGREE. https://api.apitube.io/openapi.json is
    OpenAPI 3.1.0 with 26 paths and no component schemas; https://apitube.io/openapi.json is
    OpenAPI 3.0.3 with 5 paths and 13 schemas. Both were fetched and both are kept under
    openapi/_original/. The api-catalog names the api.apitube.io copy as `service-desc`, so that
    one is treated as canonical and is the working document. The apex copy is retained as
    evidence of the discrepancy; it is the provider's to reconcile.
    The MCP server at https://mcp.apitube.io/ was probed live and answered tools/list anonymously
    with two tools, search_news and suggest. The REST API was probed at
    api.apitube.io/v1/news/everything and returned 401 JSON, which is correct gating.
