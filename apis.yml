aid: apitube
name: APITube
description: >-
  APITube is a news data API providing search and retrieval across news articles, top headlines,
  trends, companies, journalists, and fact-checks, with taxonomy resolution for entities, topics
  and locations. The public contract is an OpenAPI 3.1 document of 26 operations served from
  api.apitube.io, authenticated with an API key by header or query parameter. APITube also
  operates a first-party MCP server at mcp.apitube.io over streamable HTTP, whose tool list is
  readable anonymously, and publishes an RFC 9727 api-catalog linkset at the apex that names the
  specification, the documentation, the llms.txt and the MCP server card.
